<style>
  @layer base {
    html, body { width: 100vw; margin: 0; padding: 0; background-color: #111317; color: #e2e2e8; }
    body { overscroll-behavior: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  }
  ::-webkit-scrollbar { display: none; }
  .chamfer {
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
</style>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen">

<!-- STICKY TELEMETRY HEADER -->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)]">
  <div class="h-16 px-gutter-mobile flex items-center justify-between gap-space-sm">
    <div class="flex flex-col min-w-0">
      <span class="font-headline-sm text-headline-sm uppercase text-on-surface tracking-wider truncate">Rally Paper &bull; VBB &bull; 2026</span>
    </div>
  </div>
</header>

<main class="flex flex-col relative w-full px-gutter-mobile pt-20 pb-space-xl bg-surface flex-grow">
<div class="flex flex-col w-full max-w-[640px] mx-auto gap-space-md">

  <form id="customForm"
        action="https://docs.google.com/forms/d/1YoJJGgtqAZ4nS_1P8cPQntnEidxToafGzNp5uxsb854/formResponse"
        method="POST"
        target="hidden_iframe"
        onsubmit="submitted=true;"
        class="flex flex-col gap-space-md">

    <!-- STAGE BROADCAST / HERO HUD -->
    <div class="flex flex-col bg-surface-card rounded-xl p-space-md shadow-xl relative overflow-hidden">
      <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-primary-container via-secondary-container to-tertiary"></div>
      <div class="flex items-center gap-space-xs pt-space-xs">
        <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-primary-container text-on-primary-container">
          <span class="material-symbols-outlined text-[16px]">sports_motorsports</span>
        </span>
        <span class="font-label-sm text-label-sm uppercase tracking-widest text-primary-fixed-dim">RALLY PAPER &bull; VBB &bull;  2026</span>
      </div>
      <div class="mt-space-sm">
        <h1 class="font-headline-xl-mobile text-headline-xl-mobile uppercase text-on-surface tracking-tight">Folha de Pré Inscrição</h1>
      </div>
    </div>

    <!-- TEAM REGISTRATION POD -->
    <div class="bg-surface-card rounded-xl p-space-md shadow-xl flex flex-col gap-space-sm">
      <p class="font-body-sm text-body-sm text-text-radar-dim">Nome da equipa:</p>
      <div class="relative flex items-center bg-surface-container-lowest rounded-lg">
        <span class="material-symbols-outlined text-text-radar-dim pl-space-sm text-[20px]">flag</span>
        <input
          class="w-full bg-transparent py-3 px-space-sm text-on-surface font-headline-sm text-headline-sm focus:outline-none placeholder:text-text-radar-dim/50 placeholder:font-body-md uppercase tracking-wider"
          id="name"
          name="entry.855869419"
          placeholder="Ex: Os Pistões Velozes"
          type="text"
          required
        >
      </div>
    </div>

    <div class="bg-surface-card rounded-xl p-space-md shadow-xl flex flex-col gap-space-sm">
      <p class="font-body-sm text-body-sm text-text-radar-dim">Marca + Modelo do carro:</p>
      <div class="relative flex items-center bg-surface-container-lowest rounded-lg">
        <span class="material-symbols-outlined text-text-radar-dim pl-space-sm text-[20px]">flag</span>
        <input
          class="w-full bg-transparent py-3 px-space-sm text-on-surface font-headline-sm text-headline-sm focus:outline-none placeholder:text-text-radar-dim/50 placeholder:font-body-md uppercase tracking-wider"
          id="name"
          name="entry.736823442"
          placeholder="Ex: Porsche Carrera"
          type="text"
          required
        >
      </div>
    </div>

    <div class="bg-surface-card rounded-xl p-space-md shadow-xl flex flex-col gap-space-sm">
      <p class="font-body-sm text-body-sm text-text-radar-dim">Cor do carro:</p>
      <div class="relative flex items-center bg-surface-container-lowest rounded-lg">
        <span class="material-symbols-outlined text-text-radar-dim pl-space-sm text-[20px]">flag</span>
        <input
          class="w-full bg-transparent py-3 px-space-sm text-on-surface font-headline-sm text-headline-sm focus:outline-none placeholder:text-text-radar-dim/50 placeholder:font-body-md uppercase tracking-wider"
          id="name"
          name="entry.2056587971"
          placeholder="Ex: Amarelo"
          type="text"
          required
        >
      </div>
    </div>

    <div class="bg-surface-card rounded-xl p-space-md shadow-xl flex flex-col gap-space-sm">
      <p class="font-body-sm text-body-sm text-text-radar-dim">Número de participantes:</p>
      <div class="relative flex items-center bg-surface-container-lowest rounded-lg">
        <span class="material-symbols-outlined text-text-radar-dim pl-space-sm text-[20px]">flag</span>
        <input
          class="w-full bg-transparent py-3 px-space-sm text-on-surface font-headline-sm text-headline-sm focus:outline-none placeholder:text-text-radar-dim/50 placeholder:font-body-md uppercase tracking-wider"
          id="name"
          name="entry.648874450"
          placeholder="Ex: 4"
          type="text"
          required
        >
      </div>
    </div>

    <!-- SUBMISSION COCKPIT / ACTION HUD -->
    <div class="bg-surface-card rounded-xl p-space-md shadow-2xl flex flex-col gap-space-md mt-space-sm">
      <div class="flex flex-col gap-space-sm">
        <button class="chamfer w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md uppercase py-4 px-space-md shadow-xl flex items-center justify-center gap-space-sm hover:brightness-110 active:scale-[0.98] transition-all" id="btn-submit" type="submit">
          <span class="material-symbols-outlined text-[24px]">send</span>
          <span>SUBMETER FOLHA DE INSCRIÇÃO</span>
        </button>
        <button class="w-full bg-surface-container-high text-text-radar-dim hover:text-error hover:bg-surface-bright font-label-md text-label-md uppercase py-2.5 rounded-lg transition-colors flex items-center justify-center gap-1" id="btn-clear" type="button">
          <span class="material-symbols-outlined text-[16px]">restart_alt</span>
          <span>Limpar Formulário</span>
        </button>
      </div>
    </div>
  </form>

  <!-- SUCCESS PANEL (shown after real submission completes) -->
  <div id="successMessage" class="hidden bg-surface-card rounded-xl p-space-lg flex flex-col items-center text-center gap-space-sm shadow-2xl">
    <div class="w-14 h-14 rounded-full bg-tertiary-container/30 text-tertiary flex items-center justify-center">
      <span class="material-symbols-outlined text-[32px]">check_circle</span>
    </div>
    <h3 class="font-headline-md text-headline-md uppercase text-on-surface">Folha Submetida!</h3>
    <p class="font-body-md text-body-md text-text-radar-dim" id="modal-summary">A vossa folha de inscrição foi gravada com sucesso.</p>
  </div>

</div>
</main>

<!-- IMAGE LIGHTBOX: tap a zone clue image to zoom, tap again to revert -->
<div id="image-lightbox" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/90 backdrop-blur-sm p-gutter-mobile cursor-zoom-out" role="dialog" aria-modal="true" aria-hidden="true">
  <img id="lightbox-img" src="" alt="" class="max-w-full max-h-full object-contain rounded-md shadow-2xl">
</div>

<!--
  Hidden Iframe
  This is required to catch the response and prevent the browser from
  navigating away from your custom page to the Google Forms confirmation screen.
-->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showSuccess(); }"></iframe>

<script>
  let submitted = false;

  function showSuccess() {
    const teamName = (document.getElementById('name')?.value || '').trim();
    const filledZones = document.querySelectorAll('.zone-input');
    let filledCount = 0;
    filledZones.forEach((input) => { if (input.value.trim().length > 0) filledCount++; });

    const summaryEl = document.getElementById('modal-summary');
    if (summaryEl) {
      summaryEl.textContent = teamName
        ? `Equipa "${teamName}" foi registada. No dia da prova será confirmada a inscrição após pagamento.`
        : ` `;
    }

    document.getElementById('customForm').style.display = 'none';
    document.getElementById('successMessage').classList.remove('hidden');
  }

  (function() {
    const inputs = document.querySelectorAll('.zone-input');
    const counterEls = [document.getElementById('zone-counter'), document.getElementById('zone-counter-2')];
    const completionStatusEl = document.getElementById('completion-status');
    const clearBtn = document.getElementById('btn-clear');

    function updateProgress() {
      let filledCount = 0;
      inputs.forEach((input, index) => {
        const zoneNum = index + 1;
        const val = input.value.trim();
        const bar = document.getElementById(`bar-${zoneNum}`);
        const card = input.closest('.checkpoint-card');
        const statusInd = card ? card.querySelector('.status-indicator') : null;
        const matchLabel = card ? card.querySelector('.code-match') : null;

        if (val.length > 0) {
          filledCount++;
          if (bar) {
            bar.classList.remove('bg-surface-bright');
            bar.classList.add('bg-tertiary');
          }
          if (statusInd) {
            statusInd.innerHTML = '<span class="material-symbols-outlined text-[16px] text-tertiary">check_circle</span> <span class="text-tertiary">PREENCHIDO</span>';
          }
          if (matchLabel) {
            matchLabel.classList.remove('opacity-0');
          }
        } else {
          if (bar) {
            bar.classList.remove('bg-tertiary');
            bar.classList.add('bg-surface-bright');
          }
          if (statusInd) {
            statusInd.innerHTML = '<span class="material-symbols-outlined text-[16px] text-text-radar-dim">lock</span> <span class="text-text-radar-dim">POR PREENCHER</span>';
          }
          if (matchLabel) {
            matchLabel.classList.add('opacity-0');
          }
        }
      });

      counterEls.forEach((el) => { if (el) el.textContent = filledCount; });

      if (completionStatusEl) {
        if (filledCount === 9) {
          completionStatusEl.textContent = 'ROTEIRO COMPLETO (9/9)';
          completionStatusEl.className = 'font-label-md text-label-md text-tertiary font-bold uppercase';
        } else if (filledCount > 0) {
          completionStatusEl.textContent = `${filledCount} DE 9 CÓDIGOS INSERIDOS`;
          completionStatusEl.className = 'font-label-md text-label-md text-secondary-container font-bold uppercase';
        } else {
          completionStatusEl.textContent = 'A AGUARDAR CÓDIGOS';
          completionStatusEl.className = 'font-label-md text-label-md text-text-radar-dim font-bold uppercase';
        }
      }
    }

    inputs.forEach((input) => input.addEventListener('input', updateProgress));

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('Tem a certeza que pretende limpar todas as respostas da folha de prova?')) {
          const teamInput = document.getElementById('name');
          if (teamInput) teamInput.value = '';
          inputs.forEach((input) => input.value = '');
          updateProgress();
        }
      });
    }

    updateProgress();
  })();

  (function() {
    const lightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const zoneImages = document.querySelectorAll('.zone-image');

    function openLightbox(img) {
      lightboxImg.src = img.currentSrc || img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      lightbox.classList.remove('flex');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    zoneImages.forEach((img) => {
      img.addEventListener('click', () => openLightbox(img));
      img.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(img);
        }
      });
    });

    lightbox.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
    });
  })();
</script>
</body>
</html>
